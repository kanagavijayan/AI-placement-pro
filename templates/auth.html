<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI PLACEMENT PRO | Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background-color: var(--bg-canvas);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-bento-sheet {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      border: var(--border-ink);
      border-radius: 32px;
      padding: 40px 36px;
      box-shadow: 0 10px 0 var(--ink-primary);
    }
    .auth-brand-center {
      text-align: center;
      margin-bottom: 26px;
    }
    .auth-glyph {
      width: 52px;
      height: 52px;
      background: var(--ink-primary);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-yellow);
      font-size: 1.4rem;
      margin-bottom: 12px;
      box-shadow: 0 3px 0 var(--ink-primary);
    }
    .auth-title {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--ink-primary);
    }
    .auth-sub {
      font-size: 0.85rem;
      color: var(--ink-muted);
      margin-top: 4px;
    }
    .auth-pill-tabs {
      display: flex;
      background: var(--bg-card-cream);
      border: var(--border-ink);
      border-radius: var(--radius-pill);
      padding: 4px;
      margin-bottom: 22px;
    }
    .auth-tab-btn {
      flex: 1;
      text-align: center;
      padding: 9px;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--ink-primary);
      cursor: pointer;
      border-radius: var(--radius-pill);
      transition: var(--transition);
      border: none;
      background: transparent;
    }
    .auth-tab-btn.active {
      background: var(--ink-primary);
      color: #FFFFFF;
    }
    .demo-callout-box {
      background: var(--bg-card-cream);
      border: var(--border-ink);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div class="auth-bento-sheet">
    <div class="auth-brand-center">
      <div class="auth-glyph">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="auth-title">AI PLACEMENT PRO</h1>
      <p class="auth-sub">Your Personal AI Placement Preparation Partner</p>
    </div>

    <!-- Quick Demo Student Callout -->
    <div class="demo-callout-box">
      <div>
        <span style="font-weight: 800;">Demo Student:</span>
        <code style="font-family: var(--font-mono); font-size: 0.82rem; margin-left: 4px;">demo / demo123</code>
      </div>
      <button type="button" class="btn-pill-cream" style="padding: 5px 12px; font-size: 0.74rem;" onclick="fillDemoStudent()">
        1-Click Fill
      </button>
    </div>

    <!-- Connected Pill Tabs -->
    <div class="auth-pill-tabs">
      <button type="button" class="auth-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
      <button type="button" class="auth-tab-btn" id="tab-register" onclick="switchAuthTab('register')">Create Account</button>
    </div>

    <!-- Login Form -->
    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" id="login-username" class="form-input" placeholder="e.g. demo" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-pill-dark" style="width: 100%; justify-content: center; padding: 13px; font-size: 0.95rem; margin-top: 10px;">
        Sign In to Platform →
      </button>
    </form>

    <!-- Register Form -->
    <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="reg-fullname" class="form-input" placeholder="e.g. Jordan Lee" required>
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="reg-username" class="form-input" placeholder="e.g. jordan" required>
      </div>
      <div class="form-group">
        <label class="form-label">College Email</label>
        <input type="email" id="reg-email" class="form-input" placeholder="e.g. jordan@college.edu" required>
      </div>
      <div class="form-group">
        <label class="form-label">College / University</label>
        <input type="text" id="reg-college" class="form-input" placeholder="e.g. Institute of Technology">
      </div>
      <div class="form-group">
        <label class="form-label">Create Password</label>
        <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-pill-dark" style="width: 100%; justify-content: center; padding: 13px; font-size: 0.95rem; margin-top: 10px;">
        Register Student Account →
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.78rem; color: var(--ink-dim);">
      ✦ Encrypted SQLite sessions & autonomous AI placement tutors
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    function switchAuthTab(tab) {
      const loginTab = document.getElementById('tab-login');
      const regTab = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');

      if (tab === 'login') {
        loginTab.classList.add('active');
        regTab.classList.remove('active');
        formLogin.style.display = 'block';
        formRegister.style.display = 'none';
      } else {
        regTab.classList.add('active');
        loginTab.classList.remove('active');
        formRegister.style.display = 'block';
        formLogin.style.display = 'none';
      }
    }

    function fillDemoStudent() {
      switchAuthTab('login');
      document.getElementById('login-username').value = 'demo';
      document.getElementById('login-password').value = 'demo123';
      showToast('Demo student credentials filled!', 'info');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.status === 'success') {
          showToast('Sign in successful! Redirecting...', 'success');
          setTimeout(() => { window.location.href = '/'; }, 500);
        } else {
          showToast(data.message || 'Login failed', 'error');
        }
      } catch (err) {
        showToast('Connection error. Please try again.', 'error');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const full_name = document.getElementById('reg-fullname').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const college = document.getElementById('reg-college').value.trim();
      const password = document.getElementById('reg-password').value;

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ full_name, username, email, college, password })
        });
        const data = await res.json();
        if (data.status === 'success') {
          showToast('Account created successfully! Redirecting...', 'success');
          setTimeout(() => { window.location.href = '/'; }, 500);
        } else {
          showToast(data.message || 'Registration failed', 'error');
        }
      } catch (err) {
        showToast('Registration error. Please try again.', 'error');
      }
    }
  </script>
</body>
</html>
